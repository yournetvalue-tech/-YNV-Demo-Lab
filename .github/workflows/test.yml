name: YNV Demo Lab - test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check JavaScript syntax
        run: |
          node --check server.mjs
          node --check test.mjs
      - name: Run isolated demo tests
        env:
          YNV_ENABLE_ACCELERATED_REWARDS: 'true'
        run: node --experimental-sqlite test.mjs
